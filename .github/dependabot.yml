# Groups minor+patch bumps into one PR per ecosystem, and bundles action/
# tooling bumps into another, so a weekly Dependabot run is mergeable in one action.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    actions-and-tooling:
      patterns:
      - actions/*
      - docker/*
      - codecov/*
      - oven-sh/*
      - github/*
